title: Dongseob Kim
name: Dongseob Kim
description: I enjoy exploring emerging technologies and designing efficient systems to implement them while meeting real-world requirements.
url: https://eastskim48.github.io
baseurl: ""
repository: eastskim48/eastskim48.github.io
locale: en
timezone: Asia/Seoul
minimal_mistakes_skin: default
remote_theme: mmistakes/minimal-mistakes@4.28.1
search: false

markdown: kramdown
permalink: /writing/:year/:month/:day/:title/
include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - scripts

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

author:
  name: Dongseob Kim
  bio: Software engineer and graduate researcher working on databases and AI systems.
  location: Seoul, South Korea
  links:
    - label: GitHub
      icon: fab fa-fw fa-github
      url: https://github.com/eastskim48
    - label: LinkedIn
      icon: fab fa-fw fa-linkedin
      url: https://www.linkedin.com/in/dongseob-kim-653883153/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      share: false
      comments: false
      related: false
  - scope:
      path: _pages
      type: pages
    values:
      layout: single
      author_profile: false

category_archive:
  type: liquid
  path: /writing/categories/
tag_archive:
  type: liquid
  path: /writing/tags/

feed:
  path: feed.xml
